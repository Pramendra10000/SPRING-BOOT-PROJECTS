##########################################################
# APPLICATION
##########################################################

server.port=8080
spring.application.name=param-mart


##########################################################
# MYSQL DATABASE
##########################################################

spring.datasource.url=jdbc:mysql://localhost:3306/parammart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


##########################################################
# JPA / HIBERNATE
##########################################################

# Options:
# create      -> Creates tables every startup
# create-drop -> Creates & drops tables on shutdown
# update      -> Updates schema without deleting data
# validate    -> Validates schema only
# none        -> Hibernate does nothing

spring.jpa.hibernate.ddl-auto=update

# Development
spring.jpa.show-sql=true

# Production
# spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

# Open Session in View
spring.jpa.open-in-view=false


##########################################################
# HIKARI CONNECTION POOL
##########################################################

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000


##########################################################
# JWT CONFIGURATION
##########################################################

jwt.secret=ZmY0YzQwYzQ5ZDI3NzY2NTVlY2Q2M2IwYjRiNjYzZjM5OTg4NzY2N2YxMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg=
jwt.expiration=86400000

# Refresh Token (7 Days)
jwt.refresh-expiration=604800000


##########################################################
# SWAGGER / OPENAPI
##########################################################

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


##########################################################
# LOGGING
##########################################################

# Root Logging
logging.level.root=INFO

# Application Logging
logging.level.com.parammart=DEBUG

# Spring Framework
logging.level.org.springframework=INFO

# Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG

# Show Query Parameters
logging.level.org.hibernate.orm.jdbc.bind=TRACE


##########################################################
# LOG FILE
##########################################################

logging.file.name=logs/parammart.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB


##########################################################
# JACKSON
##########################################################

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true


##########################################################
# FILE UPLOAD
##########################################################

spring.servlet.multipart.enabled=true


##########################################################
# ACTUATOR
##########################################################

management.endpoints.web.exposure.include=health,info,logfile
management.endpoint.health.show-details=always


##########################################################
# DEVTOOLS
##########################################################

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


##########################################################
# PARAMMART LOCAL FILE STORAGE
##########################################################

# Keep LocalStorageService for development/fallback.
app.storage.local.root=uploads

app.storage.local.public-base-url=http://localhost:8080/media


##########################################################
# PARAMMART SUPABASE STORAGE
##########################################################

# Keep disabled until SupabaseStorageService is implemented
# and credentials are configured.
app.storage.supabase.enabled=true
# when above is true project use the supabse db not local .

# Supabase project Storage S3 endpoint
# We will verify the exact endpoint from Supabase S3 Configuration.
app.storage.supabase.endpoint=https://hifebhecvgiqxqlvhdar.storage.supabase.co/storage/v1/s3

# Supabase S3 region
# Your project is currently located in Tokyo.
# We will verify the exact value before enabling Supabase.
app.storage.supabase.region=ap-northeast-1

# Supabase Storage bucket
app.storage.supabase.bucket=parammart-media

# Public URL for the public bucket
app.storage.supabase.public-base-url=https://hifebhecvgiqxqlvhdar.supabase.co/storage/v1/object/public/parammart-media
# NEVER put the real credentials directly in this file.
# They will be supplied through environment variables.

#app.storage.supabase.access-key=${SUPABASE_STORAGE_ACCESS_KEY:}
#app.storage.supabase.secret-key=${SUPABASE_STORAGE_SECRET_KEY:}

##########################################################
# MULTIPART UPLOAD LIMITS
##########################################################

# Supabase Free currently allows individual files up to 50 MB.
spring.servlet.multipart.max-file-size=50MB

# Request can be slightly larger than the individual file limit.
spring.servlet.multipart.max-request-size=60MB


