spring.application.name=Products

#changing server port
server.port=8082

#databse configuration: mysql
spring.datasource.url=jdbc:mysql://localhost:3306/shopproduct
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.fail-on-empty-beans=false



#below is for static dummy user and pass for Basic Auth in spring security
spring.security.user.name=Prod
spring.security.user.password=Prod

